<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청년부 일본단기선교 일본어 퀴즈 30문항</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
      background-color: #f0fdf4;
    }
    .gradient-bg {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

  <!-- Main Container -->
  <div class="w-full max-w-2xl bg-white rounded-3xl card-shadow border border-emerald-100 overflow-hidden my-6">
    
    <!-- Header -->
    <header class="gradient-bg text-white p-6 text-center relative">
      <div class="inline-block bg-white/20 px-3 py-1 rounded-full text-xs font-semibold mb-2 backdrop-blur-sm">
        ✝️ 어린이 비전선교 & 주일학교 퀴즈
      </div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-tight">일본어 한글 표기 30문항 퀴즈</h1>
      <p class="text-emerald-100 text-sm mt-1">예수님의 사랑을 일본어로 전해요!</p>
    </header>

    <!-- Start Screen -->
    <div id="start-screen" class="p-8 text-center">
      <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner">
        🇯🇵
      </div>
      <h2 class="text-xl font-bold text-slate-800 mb-3">준비되셨나요?</h2>
      <p class="text-slate-600 text-sm mb-6 leading-relaxed">
        선교지와 주일학교에서 꼭 필요한 24가지 일본어 표현을 기반으로 한<br><b>30문항 랜덤 퀴즈</b>입니다.
      </p>
      <button onclick="startQuiz()" class="w-full sm:w-auto px-8 py-4 gradient-bg text-white font-bold rounded-2xl shadow-lg hover:brightness-105 active:scale-95 transition-all duration-200 text-lg">
        🚀 퀴즈 시작하기
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="p-6 hidden">
      <!-- Progress Bar -->
      <div class="mb-6">
        <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
          <span id="question-number">문제 1 / 30</span>
          <span id="score-count" class="text-emerald-600">점수: 0점</span>
        </div>
        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
          <div id="progress-bar" class="gradient-bg h-full transition-all duration-300" style="width: 3.33%;"></div>
        </div>
      </div>

      <!-- Question Box -->
      <div class="bg-emerald-50/50 rounded-2xl p-5 mb-6 border border-emerald-100">
        <span id="question-category" class="inline-block bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-md font-bold mb-2">
          카테고리
        </span>
        <h3 id="question-text" class="text-lg font-bold text-slate-800 leading-snug">
          질문이 여기에 표시됩니다.
        </h3>
      </div>

      <!-- Options Container -->
      <div id="options-container" class="space-y-3 mb-6">
        <!-- Dynamic options will be inserted here -->
      </div>

      <!-- Explanation Box (Hidden by default) -->
      <div id="explanation-box" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6">
        <div id="explanation-title" class="font-bold text-sm mb-1"></div>
        <p id="explanation-text" class="text-xs text-slate-600 leading-relaxed"></p>
      </div>

      <!-- Next Button -->
      <button id="next-btn" onclick="nextQuestion()" class="hidden w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow transition duration-200">
        다음 문제로 👉
      </button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="p-8 text-center hidden">
      <div class="w-20 h-20 bg-yellow-100 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
        🏆
      </div>
      <h2 class="text-2xl font-black text-slate-800 mb-1">수고하셨습니다!</h2>
      <p class="text-slate-500 text-sm mb-6">퀴즈를 모두 완료했습니다.</p>

      <div class="bg-emerald-50 rounded-2xl p-6 mb-6 border border-emerald-100">
        <div class="text-sm text-slate-600 mb-1">최종 점수</div>
        <div class="text-4xl font-black text-emerald-600"><span id="final-score">0</span> <span class="text-lg font-normal text-slate-500">/ 100점</span></div>
        <div id="result-message" class="text-xs font-medium text-emerald-700 mt-2"></div>
      </div>

      <button onclick="restartQuiz()" class="w-full py-4 gradient-bg text-white font-bold rounded-2xl shadow-lg hover:brightness-105 active:scale-95 transition duration-200">
        🔄 다시 도전하기
      </button>
    </div>

  </div>

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedAnswer = null;

    function startQuiz() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      currentQuestionIndex = 0;
      score = 0;
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestionIndex];
      
      // Update Question Info
      document.getElementById('question-number').innerText = `문제 ${currentQuestionIndex + 1} / ${questions.length}`;
      document.getElementById('score-count').innerText = `점수: ${score}점`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
      document.getElementById('question-category').innerText = q.category;
      document.getElementById('question-text').innerText = q.question;

      // Reset options & UI
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      document.getElementById('explanation-box').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');
      selectedAnswer = null;

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-4 rounded-xl border border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/50 transition-all duration-150 flex items-center justify-between font-medium text-slate-700 option-btn`;
        btn.onclick = () => selectOption(index);
        btn.innerHTML = `
          <span>${index + 1}. ${option}</span>
          <i class="far fa-circle text-slate-300 option-icon"></i>
        `;
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(index) {
      if (selectedAnswer !== null) return; // Prevent changing choice
      selectedAnswer = index;

      const q = questions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.option-btn');
      const explanationBox = document.getElementById('explanation-box');
      const explanationTitle = document.getElementById('explanation-title');
      const explanationText = document.getElementById('explanation-text');

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        const icon = btn.querySelector('.option-icon');

        if (i === q.answer) {
          btn.classList.remove('border-slate-200', 'hover:bg-emerald-50/50');
          btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'font-bold');
          icon.className = 'fas fa-check-circle text-emerald-600 text-lg';
        } else if (i === index) {
          btn.classList.remove('border-slate-200');
          btn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
          icon.className = 'fas fa-times-circle text-rose-500 text-lg';
        }
      });

      if (index === q.answer) {
        score += Math.round(100 / questions.length);
        explanationTitle.className = 'font-bold text-sm mb-1 text-emerald-700';
        explanationTitle.innerText = '⭕ 정답입니다!';
      } else {
        explanationTitle.className = 'font-bold text-sm mb-1 text-rose-600';
        explanationTitle.innerText = '❌ 아쉽네요! 정답은 ' + (q.answer + 1) + '번입니다.';
      }

      explanationText.innerText = q.explanation;
      explanationBox.classList.remove('hidden');
      document.getElementById('next-btn').classList.remove('hidden');
      document.getElementById('score-count').innerText = `점수: ${score}점`;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = score;

      const msg = document.getElementById('result-message');
      if (score >= 90) {
        msg.innerText = "🎉 대단해요! 완벽하게 준비되었습니다. 일본 선교의 멋진 일꾼이에요!";
      } else if (score >= 70) {
        msg.innerText = "👍 아주 훌륭합니다! 조금만 더 연습하면 완벽해질 거예요.";
      } else {
        msg.innerText = "🌱 복습을 통해 일본어 표현을 차근차근 익혀보아요. 화이팅!";
      }
    }

    function restartQuiz() {
      document.getElementById('result-screen').classList.add('hidden');
      startQuiz();
    }
  </script>
